- id: ghostcite
  name: ghostcite (ghost-citation check)
  description: Catch citations whose claimed author/year does not match the DOI's CrossRef record.
  entry: ghostcite
  language: python
  files: \.(bib|md)$
  # ghostcite's CLI accepts multiple positional files, so let pre-commit append the
  # matched staged .bib/.md files automatically. Put flags (e.g. --fail-on) in
  # `args:` in .pre-commit-config.yaml; the filenames are added after them.
  pass_filenames: true
