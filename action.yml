name: ghostcite
description: "Catch ghost citations (author/year mismatch + retractions) in your references."
branding:
  icon: check-circle
  color: purple

inputs:
  paths:
    description: "File(s) or directory to scan for citations (BibTeX / Markdown / DOI lists)."
    required: false
    default: "."
  fail-on:
    description: "Comma-separated tiers that cause a non-zero exit (author, title, year, retraction)."
    required: false
    default: "author,title,year,retraction"
  args:
    description: "Extra arguments passed verbatim to the ghostcite CLI."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.x"

    - name: Install ghostcite
      shell: bash
      # Pinned for reproducibility/supply-chain safety; bumped alongside the
      # major-tag move in release.yml so `@v1` always installs a known version.
      run: pip install "ghostcite==0.4.0"

    - name: Run ghostcite
      shell: bash
      # Untrusted inputs are passed via env (never interpolated into the command
      # string) so a crafted `paths`/`args` can't inject shell. PATHS/ARGS are
      # intentionally unquoted to allow multiple space-separated values.
      env:
        GC_FAIL_ON: ${{ inputs.fail-on }}
        GC_ARGS: ${{ inputs.args }}
        GC_PATHS: ${{ inputs.paths }}
      run: ghostcite --color always --fail-on "$GC_FAIL_ON" $GC_ARGS $GC_PATHS
