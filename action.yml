name: ghostcite
description: "Catch ghost citations (author/year mismatch + retractions) in your references."
branding:
  icon: check-circle
  color: purple

inputs:
  paths:
    description: "File(s) or directory to scan for citations (BibTeX / Markdown / DOI lists)."
    required: false
    default: "."
  fail-on:
    description: "Comma-separated tiers that cause a non-zero exit (author, year, retraction)."
    required: false
    default: "author,year,retraction"
  args:
    description: "Extra arguments passed verbatim to the ghostcite CLI."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.x"

    - name: Install ghostcite
      shell: bash
      run: pip install ghostcite

    - name: Run ghostcite
      shell: bash
      run: ghostcite --color always --fail-on "${{ inputs.fail-on }}" ${{ inputs.args }} "${{ inputs.paths }}"
