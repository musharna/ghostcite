[project]
name = "ghostcite"
version = "0.4.0"
description = "Catch ghost citations — cross-check a bibliography's claimed author/year against CrossRef"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jaret Arnold" }]
keywords = ["citations", "crossref", "bibtex", "research-integrity", "doi", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup",
    "Environment :: Console",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-httpx>=0.30", "pytest-cov>=4", "ruff", "mypy"]
# Optional: only needed to regenerate the README demo card (examples/gen_demo_card.py).
viz = ["pillow>=10"]

[project.scripts]
ghostcite = "ghostcite.cli:main"

[project.urls]
Homepage = "https://github.com/musharna/ghostcite"
Repository = "https://github.com/musharna/ghostcite"
Issues = "https://github.com/musharna/ghostcite/issues"
Changelog = "https://github.com/musharna/ghostcite/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghostcite"]

[tool.hatch.build.targets.sdist]
# Ship source + packaging metadata only; never local session state or build junk.
# (Belt-and-suspenders alongside the .gitignore entry for .claude/.)
include = [
    "src/ghostcite",
    "tests",
    "README.md",
    "LICENSE",
    "NOTICE",
    "CHANGELOG.md",
    "CITATION.cff",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real CrossRef API (deselect with -m 'not live')"]

[tool.coverage.run]
source = ["ghostcite"]

[tool.coverage.report]
# Measured floor is 89% (`pytest --cov`, not-live suite); 85 leaves headroom
# so small non-live deltas don't break the gate.
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SIM117"]

[tool.mypy]
# mypy 2.x can no longer *target* 3.9; 3.10 is its floor. The package still
# supports 3.9 at runtime (requires-python) and is linted for 3.9 syntax
# (ruff target-version = py39); no 3.10-only typing is used here.
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
